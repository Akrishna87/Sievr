name: App

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pipeline tests
        working-directory: pipeline
        run: |
          pip install -q -r requirements.txt pytest
          python -m pytest -q -p no:cacheprovider
      # Without signing secrets, builds are signed with a debug key kept in the Actions cache,
      # so each build still installs as an update over the last one.
      - name: Keep the debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sievr-debug-keystore-v1
      - name: Create the debug key on the first build
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Release signing key from secrets (optional)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Engine tests, app unit tests and the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew --no-daemon :core:test :app:testReleaseUnitTest :app:assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            echo "=== Errors ==="
            grep -E '^e: |error:|FAILED|What went wrong' -A3 build.log | sed 's|file:///home/runner/work/sievr/sievr/||' | tail -150
          fi
          exit $status
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Sievr.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sievr-apk
          path: Sievr.apk

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sievr-apk
          path: out
      - name: Publish the APK as the "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest out/Sievr.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Sievr for Android (build ${{ github.run_number }})" \
            --notes "Download **Sievr.apk** on your Android phone, open it, and allow installing from your browser when asked. Market data updates every weekday evening from the \`data-latest\` release."
