name: App

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pipeline tests
        working-directory: pipeline
        run: |
          pip install -q -r requirements.txt pytest
          python -m pytest -q -p no:cacheprovider
      # Without signing secrets, builds are signed with a debug key kept in the Actions cache,
      # so each build still installs as an update over the last one.
      - name: Keep the debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/sievr-signing/debug.keystore
          key: sievr-debug-keystore-v1
      - name: Create the debug key on the first build
        run: |
          if [ ! -f ~/sievr-signing/debug.keystore ]; then
            mkdir -p ~/sievr-signing
            keytool -genkeypair -keystore ~/sievr-signing/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "DEBUG_KEYSTORE=$HOME/sievr-signing/debug.keystore" >> "$GITHUB_ENV"
      - name: Release signing key from secrets (optional)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Engine tests, app unit tests and the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew --no-daemon :core:test :app:testReleaseUnitTest :app:assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            echo "=== Errors ==="
            grep -E '^e: |error:|FAILED|What went wrong' -A3 build.log | sed 's|file:///home/runner/work/sievr/sievr/||' | tail -150
          fi
          exit $status
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Sievr.apk
      # Every release must be signed with Sievr's permanent key, or phones refuse the update.
      # The SHA-256 fingerprint of that key's certificate is public; the key itself is in the repository secrets.
      - name: Check the APK is signed with Sievr's release key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          expected="b80205ea476bf4529f5a43caacf93ec4c8c3c31e7545fdd0829de9e81fb17d99"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          actual=$("$apksigner" verify --print-certs Sievr.apk | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          echo "Signed with certificate SHA-256: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Not signed with Sievr's release key. Check the four SIGNING_* repository secrets; this build won't be published."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Sievr-apk
          path: Sievr.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Sievr-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and walk through the app on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash ci/smoke-test.sh apk/Sievr.apk smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screens
          path: smoke-out

  publish:
    needs: [build, smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sievr-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: smoke-test-screens
          path: screens
      - name: Publish the APK as the "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The app reads version.json to tell people a newer build is ready.
          cat > out/version.json <<JSON
          {"versionCode": ${{ github.run_number }}, "versionName": "0.1.${{ github.run_number }}", "apk": "Sievr.apk",
           "sha256": "$(sha256sum out/Sievr.apk | cut -d' ' -f1)", "size": $(stat -c %s out/Sievr.apk)}
          JSON
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest out/Sievr.apk out/version.json screens/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Sievr for Android (build ${{ github.run_number }})" \
            --notes "Download **Sievr.apk** on your Android phone, open it, and allow installing from your browser when asked. Market data updates every weekday evening from the \`data-latest\` release. The PNG files are screenshots from this build's automatic emulator test."
